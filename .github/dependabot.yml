version: 2

# Actions on a floating major tag still go stale, and a security fix in a
# pinned one is invisible without something watching. Monthly rather than
# weekly: this is a small project, and a flood of PRs gets ignored, which
# is worse than none.

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore"
    labels: [dependencies]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore"
    labels: [dependencies]
    # The runtime surface is deliberately one package. Patch bumps of a
    # CLI framework are not worth a PR each; real breakage shows up in CI
    # against the version range in pyproject.toml.
    ignore:
      - dependency-name: typer
        update-types: [version-update:semver-patch]
