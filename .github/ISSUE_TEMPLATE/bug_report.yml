name: Bug report
description: Something extracted wrongly, crashed, or reported the wrong thing.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not report security issues here. See
        [SECURITY.md](../blob/main/SECURITY.md) for private reporting.

  - type: input
    id: image
    attributes:
      label: Image reference
      description: The exact reference, so this can be reproduced against the same bytes.
      placeholder: "alpine:3.19, or ghcr.io/org/app@sha256:..."
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command
      description: The full command, including flags.
      placeholder: "st -f images.txt -o ./out -c 4"
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened instead
      description: |
        Be concrete. "It failed" is hard to act on; "the pull reported ok but
        /bin/sh is a dangling symlink" is a bug report.
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Output
      description: |
        Paste the run. Progress goes to stderr, so use `st ... 2>&1 | tee log.txt`
        to capture it. Redact anything private.
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `st --version`.
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: OS and Python
      placeholder: "macOS 14 arm64, Python 3.14"
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: |
        If it is an extraction problem, `st verify <folder> --deep` and the
        contents of `.image.json` are usually the fastest route to the cause.
