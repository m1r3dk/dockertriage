blank_issues_enabled: false
contact_links:
  # Relative paths would be cleaner, but GitHub requires absolute URLs here.
  # If this repository is published under a different owner or name, update
  # these two links and the [project.urls] block in pyproject.toml together.
  - name: Security vulnerability
    url: https://github.com/lalkishan/dockertriage/security/advisories/new
    about: Report privately. Please do not open a public issue for security problems.
  - name: Question or usage help
    url: https://github.com/lalkishan/dockertriage/discussions
    about: Ask here if something is unclear rather than filing a bug.
