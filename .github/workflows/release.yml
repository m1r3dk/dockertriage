name: release

# Publishing is gated on a tag, and the tag must agree with the version in
# the package. A release that ships different bytes than its number claims is
# worse than no automation at all.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          pip install build
          python -m build

      - name: Tag must match the packaged version
        run: |
          python - <<'EOF'
          import os, pathlib, re, sys
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          src = pathlib.Path("src/dockertriage/version.py").read_text()
          pkg = re.search(r'__version__\s*=\s*"([^"]+)"', src).group(1)
          if tag != pkg:
              sys.exit(f"tag v{tag} does not match __version__ {pkg}")
          print(f"tag and package agree on {pkg}")
          EOF

      - name: The built wheel installs and runs
        run: |
          pip install dist/*.whl
          cd /tmp
          dt --version

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    # Requires a PyPI trusted publisher for this repository, and a GitHub
    # environment named `pypi`. Until those exist the job is skipped rather
    # than failing the release.
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
