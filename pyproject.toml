[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "srctriage"
dynamic = ["version"]
description = "Download a Docker image and extract its full rootfs to a folder. No daemon, no root."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Kishan Lal", email = "kishan.lal@m1r3dk.com" }]
maintainers = [{ name = "Kishan Lal", email = "kishan.lal@m1r3dk.com" }]
keywords = ["docker", "oci", "registry", "rootfs", "container", "extract"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Archiving :: Packaging",
    "Topic :: Security",
    "Typing :: Typed",
]

# The CLI is typer. The library modules themselves import nothing outside the
# standard library, so `import srctriage` in someone else's code stays cheap.
# zstd layers are handled by the standard-library compression.zstd module, which
# is part of Python 3.14, so there is no optional dependency for it.
dependencies = ["typer>=0.12"]

[dependency-groups]
# `uv sync` installs these; `pip install srctriage` does not.
dev = ["mypy>=1.11,<2.4", "pytest>=8", "ruff>=0.6"]

[project.scripts]
st = "srctriage.cli:main"
srctriage = "srctriage.cli:main"

[tool.hatch.version]
path = "src/srctriage/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/srctriage"]
# PEP 561: ship the marker so a consumer's type checker actually reads our
# annotations instead of treating the package as untyped.
artifacts = ["src/srctriage/py.typed"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "README.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "LICENSE",
]

[project.urls]
Homepage = "https://github.com/m1r3dk/srctriage"
Documentation = "https://github.com/m1r3dk/srctriage#readme"
Source = "https://github.com/m1r3dk/srctriage"
Changelog = "https://github.com/m1r3dk/srctriage/blob/main/CHANGELOG.md"
Issues = "https://github.com/m1r3dk/srctriage/issues"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The public API surface is re-exported deliberately.
"src/srctriage/__init__.py" = ["F401"]
# Typer's API *is* calls-in-defaults, so B008 (function call in a default
# argument) is how every option is declared.
"src/srctriage/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.14"
files = ["src"]
